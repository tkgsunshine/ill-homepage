<svg xmlns="http://www.w3.org/2000/svg" width="320" height="60" viewBox="0 0 160 30" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;800&amp;display=swap');
      .logo-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 22px;
        fill: #0f172a;
        letter-spacing: 0.05em;
      }
      .logo-sub {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #00abcc;
        letter-spacing: 0.1em;
      }
    </style>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="40" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2e9b" />
      <stop offset="50%" stop-color="#8a14ff" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
  <g transform="translate(0, 0)">
    <rect x="4" y="2" width="6" height="26" rx="3" fill="url(#logo-grad)" />
    <rect x="17" y="2" width="6" height="26" rx="3" fill="url(#logo-grad)" />
    <rect x="30" y="2" width="6" height="26" rx="3" fill="url(#logo-grad)" />
  </g>
  
  <!-- Logo Text -->
  <text x="44" y="23" class="logo-title">ILL</text>
  <text x="76" y="23" class="logo-sub">INC.</text>
</svg>
