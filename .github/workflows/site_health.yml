name: Site Health (manual)

on:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure responses and PageSpeed
        run: python3 scripts/site_health.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/marketing/site-health.md
          git diff --cached --quiet || (git commit -m "Add site health report" && git pull --rebase origin main && git push origin main)
