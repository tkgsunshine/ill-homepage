name: Daily Column Auto-Generator Pipeline

on:
  schedule:
    # Morning slot (Target JST 8:00 AM = UTC 23:00 prev day)
    # Off-peak times with retries at 8:05, 8:15, 8:30 JST
    - cron: '5 23 * * *'
    - cron: '15 23 * * *'
    - cron: '30 23 * * *'
    # Evening slot (Target JST 17:00 PM = UTC 08:00)
    # Off-peak times with retries at 17:05, 17:15, 17:30 JST
    - cron: '5 8 * * *'
    - cron: '15 8 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Column Generation & Index Pipeline
        run: |
          python3 scripts/generate_next_blog_post.py
          python3 scripts/apply_new_thumbnail_design.py
          python3 scripts/apply_seo_optimizations.py

      - name: Commit and Push Changes to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-generate daily B2B column via GitHub Actions"
          git push origin main
