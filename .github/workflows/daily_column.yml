name: Column Auto-Generator Pipeline (twice a week)

on:
  schedule:
    # Twice a week (changed 2026-11-24 from twice a day): Tuesday and Friday, JST 8:00 AM.
    # JST 8:05 / 8:15 / 8:30 = UTC 23:05 / 23:15 / 23:30 on the previous day (Monday and Thursday in UTC).
    # The later two are retries; the script skips them when a column was published in the last 2.5 hours.
    - cron: '5 23 * * 1,4'
    - cron: '15 23 * * 1,4'
    - cron: '30 23 * * 1,4'
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Column Generation & Index Pipeline
        run: |
          python3 scripts/generate_next_blog_post.py
          python3 scripts/apply_new_thumbnail_design.py
          python3 scripts/apply_seo_optimizations.py

      - name: Commit and Push Changes to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "Auto-generate daily B2B column via GitHub Actions" && git pull --rebase origin main && git push origin main)

