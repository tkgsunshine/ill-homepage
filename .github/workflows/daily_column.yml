name: Daily Column Auto-Generator Pipeline

# Scheduled automatic generation is disabled.
# To generate manually, trigger via GitHub Actions workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Column Generation & Index Pipeline
        run: |
          python3 scripts/generate_next_blog_post.py
          python3 scripts/apply_new_thumbnail_design.py
          python3 scripts/apply_seo_optimizations.py

      - name: Commit and Push Changes to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "Auto-generate daily B2B column via GitHub Actions" && git pull --rebase origin main && git push origin main)

