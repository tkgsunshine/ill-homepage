name: Lighthouse Detail (manual)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated URLs'
        required: true
        default: 'https://re-en.jp/ https://www.tsuki-to-ren.com/ https://www.ill-inc.net/'

jobs:
  detail:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Lighthouse
        env:
          LH_URLS: ${{ inputs.urls }}
        run: python3 scripts/lh_detail.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/marketing/lh-detail.md
          git diff --cached --quiet || (git commit -m "Add Lighthouse detail report" && git pull --rebase origin main && git push origin main)
